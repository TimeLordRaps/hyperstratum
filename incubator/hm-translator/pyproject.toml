[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmtrans"
version = "0.1.0.dev0"
description = "Translate .hm sources into a canonical IR, Lean 4 and Metamath, with a receipt that says what was and was not translated."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
hmtrans = "hmtrans.cli:console"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-vv -s --durations=10 --timeout=60"
