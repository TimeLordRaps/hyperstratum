# Copy into a hyperfield repository as .github/workflows/notify-hyperstratum.yml.
# On every push to the default branch it tells hyperstratum to move that
# field's pin, so the wiki follows within minutes rather than at the next
# scheduled sync. Needs a secret HYPERSTRATUM_DISPATCH_TOKEN that may create
# repository dispatches on TimeLordRaps/hyperstratum (fine-grained token with
# "Contents: read and write" on that one repository).
name: notify-hyperstratum
on:
  push:
    branches: [main]
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Announce the new head
        env:
          GH_TOKEN: ${{ secrets.HYPERSTRATUM_DISPATCH_TOKEN }}
        run: |
          gh api repos/TimeLordRaps/hyperstratum/dispatches \
            -f event_type=field-updated \
            -f "client_payload[field]=${GITHUB_REPOSITORY#*/}" \
            -f "client_payload[sha]=${GITHUB_SHA}"
