name: wiki

# Rebuilds the wiki from the PINNED hyperfields and refuses what cannot be
# vouched for. Runs on every pull request -- including the ones Dependabot opens
# to move a pin, which is the whole point: the review of "field X changed" is
# this job's output.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wiki-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # "true" only when nothing in this pin move needs a person (see
      # `hyperstratum check --verdict`). Consumed by the automerge job below.
      clean: ${{ steps.verdict.outputs.clean }}
    env:
      # Absent fields/ is a failure here, never a quiet skip.
      HYPERSTRATUM_REQUIRE_FIELDS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # Full history: the audit compares each commit-pinned citation of this
          # repository with its current blob, which needs the cited commit.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests (streamed, per-test and overall bounds)
        run: python -m pytest -vv -s --durations=10 --timeout=120
      - name: Incubator tests (hyperphysics limits)
        run: PYTHONPATH=incubator/hyperphysics-limits/src python -m pytest incubator/hyperphysics-limits/tests -vv -s --durations=10 --timeout=60
      - name: Check registry, references and citations
        shell: bash
        run: |
          set -o pipefail
          python -m hyperstratum check --verdict verdict.json | tee check.txt
          {
            echo '### hyperstratum check'
            echo '```'
            tail -n 80 check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read the verdict
        id: verdict
        run: |
          echo "clean=$(jq -r .clean verdict.json)" >> "$GITHUB_OUTPUT"
          {
            echo '### Needs a person?'
            jq -r 'if .clean then "No: no errors, no drifted or missing reference, no definition drift." else (.attention[] | "- **\(.code)** \(.subject): \(.detail)") end' verdict.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pins match what is checked out
        run: git submodule status --recursive | grep -v '^ ' && exit 1 || echo "every checkout is at its pinned commit"
      - name: Build the site and report what changed since the last deploy
        shell: bash
        run: |
          python -m hyperstratum build --out _site/wiki \
            --previous "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/wiki/wiki.json"
          if [ -f _site/wiki/changes.md ]; then
            cat _site/wiki/changes.md >> "$GITHUB_STEP_SUMMARY"
          fi

  automerge:
    # Opt-in twice: the file ships, but nothing merges until the repository
    # variable AUTOMERGE_FIELDS is set to "true" AND branch protection requires
    # the `wiki` check. Only a pin move qualifies -- authored by Dependabot or
    # the sync branch, from this repository, touching nothing but fields/ -- and
    # only when the verdict is clean. Anything else waits for a person.
    needs: wiki
    if: >-
      github.event_name == 'pull_request' &&
      vars.AUTOMERGE_FIELDS == 'true' &&
      needs.wiki.outputs.clean == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.actor == 'dependabot[bot]' || startsWith(github.head_ref, 'sync/fields-'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge for a fields-only pin move
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          stray=$(printf '%s\n' "$files" | grep -v '^fields/' || true)
          if [ -n "$stray" ]; then
            echo "not a pure pin move; leaving it for a person:"; echo "$stray"
            echo "auto-merge skipped: touches files outside fields/" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash; then
            echo "auto-merge enabled: clean verdict, fields-only" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::could not enable auto-merge (repository setting 'Allow auto-merge' and a required check are prerequisites)"
            echo "auto-merge NOT enabled: see warning" >> "$GITHUB_STEP_SUMMARY"
          fi
