name: wiki

# Rebuilds the wiki from the PINNED hyperfields and refuses what cannot be
# vouched for. Runs on every pull request -- including the ones Dependabot opens
# to move a pin, which is the whole point: the review of "field X changed" is
# this job's output.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wiki-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wiki:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Absent fields/ is a failure here, never a quiet skip.
      HYPERSTRATUM_REQUIRE_FIELDS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # Full history: the audit compares each commit-pinned citation of this
          # repository with its current blob, which needs the cited commit.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests (streamed, per-test and overall bounds)
        run: python -m pytest -vv -s --durations=10 --timeout=120
      - name: Check registry, references and citations
        shell: bash
        run: |
          set -o pipefail
          python -m hyperstratum check | tee check.txt
          {
            echo '### hyperstratum check'
            echo '```'
            tail -n 80 check.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Pins match what is checked out
        run: git submodule status --recursive | grep -v '^ ' && exit 1 || echo "every checkout is at its pinned commit"
      - name: Build the site
        run: python -m hyperstratum build --out _site/wiki
